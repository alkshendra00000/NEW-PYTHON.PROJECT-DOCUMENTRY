<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Fire Drop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-frame" id="gameCanvasWrapper">
    <div class="sky-cloud cloud1"></div>
    <div class="sky-cloud cloud2"></div>
    <div class="plane" id="plane"></div>
    <div class="drop-zone" id="dropZone"></div>
    <div class="player" id="player">
      <div class="parachute" id="parachute"></div>
      <div class="gun" id="gun" aria-hidden="true"></div>
    </div>
    <div class="gun-crate" id="gunCrate"></div>
    <div class="player player2" id="player2">
      <div class="gun" id="gun2" aria-hidden="true"></div>
    </div>
    <div class="ground-line"></div>
    <div class="status-note" id="statusNote">Start karo</div>
    <div class="minimap" id="minimap">
      <div class="mini-map-canvas" id="miniMapCanvas">
        <div class="mini-player" id="miniPlayer" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <button class="btn-start" id="startBtn">Start</button>

  <div class="overlay" id="gameOverScreen">
    <div class="overlay-card">
      <h2>Game Over</h2>
      <button class="btn-restart" id="restartBtn">Phir se</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
