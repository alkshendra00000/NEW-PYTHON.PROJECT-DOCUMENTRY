<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors Game</title>
<link rel="stylesheet" href="pro.css">
</head>

<body>

<main class="game">
<h1>Rock Paper Scissors</h1>

<div class="choices">
    <button class="choice" id="rock" type="button" aria-label="Choose rock">
        <img src="rock.svg" alt="Rock">
        <span>Rock</span>
    </button>

    <button class="choice" id="paper" type="button" aria-label="Choose paper">
        <img src="paper.svg" alt="Paper">
        <span>Paper</span>
    </button>

    <button class="choice" id="scissors" type="button" aria-label="Choose scissors">
        <img src="scissors.svg" alt="Scissors">
        <span>Scissors</span>
    </button>
</div>

<div class="score-board">

    <div class="score">
        <p id="user-score">0</p>
        <p>You</p>
    </div>

    <div class="score">
        <p id="comp-score">0</p>
        <p>Comp</p>
    </div>

</div>

<div class="msg-container">
    <p id="msg" role="status" aria-live="polite">Play your move</p>
    <button id="play-again" class="play-again" type="button">Play Again</button>
</div>
</main>

<script src="script.js"></script>

</body>
</html>
